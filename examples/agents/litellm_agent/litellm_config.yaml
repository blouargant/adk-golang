# Example LiteLLM Configuration
# Save this as litellm_config.yaml and use with: litellm --config litellm_config.yaml --port 4000

model_list:
  # OpenAI models
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: os.environ/OPENAI_API_KEY
      
  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic models
  - model_name: claude-3-sonnet
    litellm_params:
      model: anthropic/claude-3-sonnet-20240229
      api_key: os.environ/ANTHROPIC_API_KEY
      
  - model_name: claude-3-haiku
    litellm_params:
      model: anthropic/claude-3-haiku-20240307
      api_key: os.environ/ANTHROPIC_API_KEY

  # Local models (example with Ollama)
  - model_name: llama2
    litellm_params:
      model: ollama/llama2
      api_base: http://localhost:11434

  # Google models
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-pro
      api_key: os.environ/GOOGLE_API_KEY

# General settings
general_settings:
  master_key: "your-master-key-here" # Optional: for securing your proxy
  
# Router settings for load balancing
router_settings:
  routing_strategy: simple-shuffle # Options: simple-shuffle, least-busy, usage-based-routing
  model_group_alias:
    gpt-3.5: ["gpt-3.5-turbo"]
    claude: ["claude-3-sonnet", "claude-3-haiku"]
    
# Optional: Enable logging
litellm_settings:
  success_callback: ["langfuse"] # Optional: for logging and analytics
  failure_callback: ["langfuse"]
